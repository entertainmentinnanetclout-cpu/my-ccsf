<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">TUT Pretoria Campus structure reference</title>
  <desc id="desc">A traced student navigation reference based on the supplied Pretoria Campus map. It shows numbered buildings, primary roads, sports fields, the dam, bus stops, Visitors Centre and Technikonrand Station. It is not a GPS map.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f0f8"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#002F6C"/><stop offset="1" stop-color="#0055A5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#002F6C" flood-opacity=".18"/></filter>
    <style>
      .road{fill:none;stroke:#283447;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}
      .road-minor{fill:none;stroke:#596579;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
      .building{fill:#c98664;stroke:#8b4f32;stroke-width:3}
      .facility{fill:#ffffff;stroke:#002F6C;stroke-width:4}
      .sports{fill:#43a66d;stroke:#21764a;stroke-width:4}
      .water{fill:#2c9ee8;stroke:#0069a8;stroke-width:4}
      .label{font:700 18px Arial,sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:middle}
      .small{font:600 14px Arial,sans-serif;fill:#172033;text-anchor:middle}
      .buildingNo{font:900 22px Arial,sans-serif;fill:#ffffff;text-anchor:middle;dominant-baseline:middle}
      .legend{font:600 16px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="920" fill="url(#page)"/>
  <rect x="28" y="28" width="1144" height="864" rx="34" fill="#fff" stroke="#d7e2ee" stroke-width="3" filter="url(#shadow)"/>
  <rect x="28" y="28" width="1144" height="112" rx="34" fill="url(#navy)"/>
  <rect x="28" y="112" width="1144" height="28" fill="#F2A900"/>
  <text x="70" y="78" font-family="Arial,sans-serif" font-size="31" font-weight="900" fill="#fff">PRETORIA CAMPUS STRUCTURE REFERENCE</text>
  <text x="70" y="111" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#dcecff">Student navigation schematic · secondary reference · live GPS map remains separate</text>
