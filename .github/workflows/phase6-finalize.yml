name: Phase 6 Tracker Finalizer

on:
  push:
    branches:
      - feature/controlled-pilot-mode

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase-6-tracker-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/controlled-pilot-mode
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/phase6_finalize.mjs
      - name: Commit tracker update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "CCSF Phase 6 Tracker Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/pilot-mode/00-phase-tracker.md
          git commit -m "docs(phase6): finalize tracker [phase-6-tracker-bot]"
          git push origin HEAD:feature/controlled-pilot-mode
