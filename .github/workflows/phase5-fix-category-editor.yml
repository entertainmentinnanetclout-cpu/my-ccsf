name: Phase 5 Fix Category Editor

on:
  push:
    branches:
      - feature/phase-5-admin-release-gate

permissions:
  contents: write

jobs:
  patch-category-editor:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-category-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-5-admin-release-gate

      - name: Correct new and existing category key handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/pilot/PilotContentManagement.tsx')
          source = path.read_text()
          source = source.replace(
              "created_by: userId, updated_by: userId, created_at: now(), updated_at: now(),\n});\n\nconst newQuickCard",
              "created_by: userId, updated_by: userId, created_at: '', updated_at: '',\n});\n\nconst newQuickCard",
              1,
          )
          source = source.replace(
              "description: category.description.trim(), updated_by: user?.id ?? null }),",
              "description: category.description.trim(), created_at: category.created_at || now(), updated_at: now(), updated_by: user?.id ?? null }),",
              1,
          )
          source = source.replace(
              "disabled={Boolean(value.created_by || value.created_at !== newCategory(null).created_at)}",
              "disabled={Boolean(value.created_at)}",
              1,
          )
          if "disabled={Boolean(value.created_at)}" not in source or "created_at: category.created_at || now()" not in source:
              raise SystemExit('Phase 5 category editor patch did not apply.')
          path.write_text(source)
          PY

      - name: Commit category editor correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/pilot/PilotContentManagement.tsx
          if git diff --cached --quiet; then
            echo "Category editor is already corrected."
          else
            git commit -m "fix: allow new review categories while locking existing keys [phase5-category-fix]"
            git push origin HEAD:feature/phase-5-admin-release-gate
          fi
