name: Institutional Hardening Phase 1

on:
  push:
    branches:
      - agent/institutional-hardening-phase-1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/institutional-hardening-phase-1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Phase 1 hardening patch
        run: |
          node scripts/apply-institutional-hardening-phase-1.mjs
          node scripts/fix-institutional-hardening-phase-1-runner.mjs

      - name: Verify institutional hardening
        run: npm run test:institutional-hardening

      - name: Verify Safety Quest branding and curriculum
        run: npm run test:safety-quest

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts package.json docs supabase/migrations
          git commit -m "fix: harden security mobile evidence and emergency flows"
          git push origin HEAD:agent/institutional-hardening-phase-1
