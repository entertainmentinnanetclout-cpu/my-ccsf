name: Phase 4 Core Product Hardening

on:
  push:
    branches:
      - feature/ccsf-phases-3-8-release-candidate
    paths:
      - scripts/apply-phase4-hardening.py
      - .github/workflows/phase4-product-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/ccsf-phases-3-8-release-candidate
          fetch-depth: 0

      - name: Apply exact-match workflow fixes
        run: python scripts/apply-phase4-hardening.py

      - name: Commit core workflow fixes
        run: |
          if git diff --quiet -- \
            src/components/student/ReportIncident.tsx \
            src/components/student/MyCaseReports.tsx \
            src/pages/Office.tsx; then
            echo 'Core workflow fixes are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/student/ReportIncident.tsx \
            src/components/student/MyCaseReports.tsx \
            src/pages/Office.tsx
          git commit -m 'phase 4: harden incident, case and office workflows'
          git push origin HEAD:feature/ccsf-phases-3-8-release-candidate
