name: CCSF Brand Asset Generation

on:
  push:
    branches:
      - main
      - feature/ccsf-phases-3-8-release-candidate
    paths:
      - src/assets/cps-ccsf-official-source.png
      - scripts/generate-brand-assets.py
      - .github/workflows/phase4-brand-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Generate platform assets from official CPS/CCSF source
        run: python scripts/generate-brand-assets.py

      - name: Verify generated image metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = [
              'src/assets/cps-ccsf-official-source.png',
              'public/app-icon-1024.png',
              'public/app-icon-512.png',
              'public/app-icon-192.png',
              'public/maskable-icon-512.png',
              'public/apple-touch-icon.png',
              'public/favicon.png',
              'public/favicon-32x32.png',
              'public/favicon-16x16.png',
              'public/favicon.ico',
          ]
          for value in paths:
              path = Path(value)
              with Image.open(path) as image:
                  rgba = image.convert('RGBA')
                  alpha = rgba.getchannel('A')
                  corners = [rgba.getpixel(point) for point in [(0, 0), (rgba.width - 1, 0), (0, rgba.height - 1), (rgba.width - 1, rgba.height - 1)]]
                  print(f'{path}: format={image.format} size={image.size} alpha={alpha.getextrema()} corners={corners}')
          PY

      - name: Commit generated binaries
        run: |
          if git diff --quiet -- \
            'public/app-icon-1024.png' \
            'public/app-icon-512.png' \
            'public/app-icon-192.png' \
            'public/maskable-icon-512.png' \
            'public/apple-touch-icon.png' \
            'public/favicon.png' \
            'public/favicon-32x32.png' \
            'public/favicon-16x16.png' \
            'public/favicon.ico'; then
            echo 'Brand assets are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'public/app-icon-1024.png' \
            'public/app-icon-512.png' \
            'public/app-icon-192.png' \
            'public/maskable-icon-512.png' \
            'public/apple-touch-icon.png' \
            'public/favicon.png' \
            'public/favicon-32x32.png' \
            'public/favicon-16x16.png' \
            'public/favicon.ico'
          git commit -m 'fix: regenerate CPS-CCSF app icons from official source'
          git push origin HEAD:${GITHUB_REF_NAME}
