name: Phase 4 Staff Chat Hardening

on:
  push:
    branches:
      - feature/ccsf-phases-3-8-release-candidate
    paths:
      - scripts/apply-phase4-chat-hardening.py
      - .github/workflows/phase4-chat-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/ccsf-phases-3-8-release-candidate
          fetch-depth: 0

      - name: Apply exact-match staff-chat fixes
        run: python scripts/apply-phase4-chat-hardening.py

      - name: Commit staff-chat fixes
        run: |
          if git diff --quiet -- src/components/admin/StaffCommunication.tsx; then
            echo 'Staff-chat fixes are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/admin/StaffCommunication.tsx
          git commit -m 'phase 4: remove dead staff-chat controls and harden failures'
          git push origin HEAD:feature/ccsf-phases-3-8-release-candidate
