name: Apply super-admin student case migration

on:
  push:
    branches:
      - main
    paths:
      - scripts/run-super-admin-student-cases-migration.mjs

permissions:
  contents: write

concurrency:
  group: super-admin-student-case-migration
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded migration
        run: node scripts/run-super-admin-student-cases-migration.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit generated source
        run: |
          if git diff --quiet -- src/components/pilot/PilotSuperAdminDashboard.tsx; then
            echo "No source changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/pilot/PilotSuperAdminDashboard.tsx
          git commit -m "feat: identify students in super-admin Pilot operations"
          git push origin HEAD:main
