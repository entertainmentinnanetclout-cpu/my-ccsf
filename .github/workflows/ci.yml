name: Pilot QA and Production Build Verification

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://lfelzsubrlqwcsnetpov.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mk06MWImT-q1YuV_zFYsDg_r61IHhuO
      VITE_VAPID_PUBLIC_KEY: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Finalize visual release assets and cleanup
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[visual-release-cleanup]') }}
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/generate-brand-assets.py
          python - <<'PY'
          from pathlib import Path

          for value in [
              '.github/workflows/repair-pwa-icon-canvases.yml',
              '.github/workflows/capture-admin-visual-typecheck.yml',
              'docs/debug/branding-verifier-output.txt',
              'docs/debug/admin-visual-typecheck.txt',
          ]:
              path = Path(value)
              if path.exists():
                  path.unlink()

          phase4 = Path('.github/workflows/phase4-brand-assets.yml')
          phase4_source = phase4.read_text().replace('      - feature/maptive-live-admin-visuals\n', '')
          phase4.write_text(phase4_source)

          generator = Path('scripts/generate-brand-assets.py')
          generator_source = generator.read_text().replace(
              'The artwork is never stretched, redrawn or recoloured. This generator is also\nused to verify install assets before visual-intelligence releases.\n',
              'The artwork is never stretched, redrawn or recoloured.\n',
          )
          generator.write_text(generator_source)
          PY
          echo '' | base64 -d > .github/workflows/ci.yml
          node scripts/verify-branding.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Visual release cleanup already complete.'
          else
            git commit -m "chore: finalize visual release assets and cleanup [visual-release-cleanup]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Verify Phase 1 Pilot authentication and navigation
        run: npm run test:phase1-auth

      - name: Verify Pilot production isolation
        run: npm run test:pilot-isolation

      - name: Verify Phase 3 activation and routing
        run: npm run test:phase3-routing

      - name: Verify core product hardening
        run: npm run test:phase4-product

      - name: Verify Phase 4 student and Phase 5 campus-security parity
        run: npm run test:phase4-5-parity

      - name: Verify Phase 6 super-admin parity
        run: npm run test:phase6-parity

      - name: Verify Phase 7 authentication, PWA and institutional consistency
        run: npm run test:phase7-consistency

      - name: Verify Phase 8 end-to-end UAT release gate
        run: npm run test:phase8-release

      - name: Verify transparent canonical CCSF and TUT branding
        run: npm run test:branding

      - name: Verify production and Pilot student-home parity
        run: npm run test:student-home

      - name: Verify admin visual intelligence
        run: npm run test:admin-visuals

      - name: Type-check application
        run: npm run typecheck

      - name: Lint application
        run: npm run lint

      - name: Build fail-closed production application
        run: npm run build
        env:
          VITE_PILOT_MODE_ENABLED: 'false'
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_REF: main

      - name: Build approved Pilot Preview application
        run: npm run build
        env:
          VITE_PILOT_MODE_ENABLED: ''
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: feature/ccsf-phases-3-8-release-candidate
