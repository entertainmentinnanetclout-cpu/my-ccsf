name: Pilot QA and Production Build Verification

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://lfelzsubrlqwcsnetpov.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mk06MWImT-q1YuV_zFYsDg_r61IHhuO
      VITE_VAPID_PUBLIC_KEY: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Pilot visual type correction
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[visual-type-fix]') }}
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/components/pilot/PilotSuperAdminDashboard.tsx'),
              Path('src/components/pilot/PilotCampusSecurityDashboard.tsx'),
          ]
          for path in paths:
              source = path.read_text()
              source = source.replace('    resolvedAt: report.resolved_at,\n', '')
              path.write_text(source)
          PY
          if git diff --quiet -- src/components/pilot/PilotSuperAdminDashboard.tsx src/components/pilot/PilotCampusSecurityDashboard.tsx; then
            echo 'Pilot visual type correction already applied.'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/pilot/PilotSuperAdminDashboard.tsx src/components/pilot/PilotCampusSecurityDashboard.tsx
            git commit -m "fix: align Pilot visual records with report types [visual-type-fix]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Capture TypeScript diagnostics
        run: npm run typecheck > admin-visual-typecheck.txt 2>&1 || true

      - name: Upload TypeScript diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: admin-visual-typecheck
          path: admin-visual-typecheck.txt
          retention-days: 1

      - name: Verify Phase 1 Pilot authentication and navigation
        run: npm run test:phase1-auth

      - name: Verify Pilot production isolation
        run: npm run test:pilot-isolation

      - name: Verify Phase 3 activation and routing
        run: npm run test:phase3-routing

      - name: Verify core product hardening
        run: npm run test:phase4-product

      - name: Verify Phase 4 student and Phase 5 campus-security parity
        run: npm run test:phase4-5-parity

      - name: Verify Phase 6 super-admin parity
        run: npm run test:phase6-parity

      - name: Verify Phase 7 authentication, PWA and institutional consistency
        run: npm run test:phase7-consistency

      - name: Verify Phase 8 end-to-end UAT release gate
        run: npm run test:phase8-release

      - name: Verify transparent canonical CCSF and TUT branding
        run: npm run test:branding

      - name: Verify production and Pilot student-home parity
        run: npm run test:student-home

      - name: Verify admin visual intelligence
        run: npm run test:admin-visuals

      - name: Type-check application
        run: npm run typecheck

      - name: Lint application
        run: npm run lint

      - name: Build fail-closed production application
        run: npm run build
        env:
          VITE_PILOT_MODE_ENABLED: 'false'
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_REF: main

      - name: Build approved Pilot Preview application
        run: npm run build
        env:
          VITE_PILOT_MODE_ENABLED: ''
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: feature/ccsf-phases-3-8-release-candidate
