name: Repair PWA Icon Canvases

on:
  push:
    branches:
      - feature/maptive-live-admin-visuals

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[pwa-icon-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maptive-live-admin-visuals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pillow
      - name: Composite app icons onto required white canvases
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = [
              Path('public/app-icon-1024.png'),
              Path('public/app-icon-512.png'),
              Path('public/app-icon-192.png'),
              Path('public/maskable-icon-512.png'),
              Path('public/apple-touch-icon.png'),
          ]
          for path in paths:
              source = Image.open(path).convert('RGBA')
              canvas = Image.new('RGBA', source.size, (255, 255, 255, 255))
              canvas.alpha_composite(source)
              canvas.convert('RGBA').save(path, optimize=True)

          debug = Path('docs/debug/branding-verifier-output.txt')
          if debug.exists():
              debug.unlink()
          workflow = Path('.github/workflows/repair-pwa-icon-canvases.yml')
          workflow.unlink()
          PY
      - name: Verify branding contract
        run: node scripts/verify-branding.mjs
      - name: Commit repaired assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-icon-1024.png public/app-icon-512.png public/app-icon-192.png public/maskable-icon-512.png public/apple-touch-icon.png docs/debug/branding-verifier-output.txt .github/workflows/repair-pwa-icon-canvases.yml
          git commit -m "fix: restore opaque white PWA icon canvases [pwa-icon-repaired]"
          git push origin HEAD:feature/maptive-live-admin-visuals
