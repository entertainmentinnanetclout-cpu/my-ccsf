name: Phase 4 Generate Safety Guide

on:
  push:
    branches:
      - feature/phase-4-student-dashboard-safety

permissions:
  contents: write

jobs:
  generate-safety-guide:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-pdf]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/phase-4-student-dashboard-safety

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: pip install reportlab pillow qrcode

      - name: Restore and run reviewed generator
        env:
          GENERATOR_GZIP_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          payload = base64.b64decode(os.environ['GENERATOR_GZIP_B64'])
          Path('/tmp/generate_phase4_safety_guide.py').write_bytes(gzip.decompress(payload))
          PY
          python /tmp/generate_phase4_safety_guide.py

      - name: Commit generated handbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/CCSF-Pilot-Safety-Guide-v1.0.pdf public/downloads/ccsf-pilot-qr.png
          if git diff --cached --quiet; then
            echo "Handbook is already current."
          else
            git commit -m "docs: add reviewed Phase 4 safety handbook [phase4-pdf]"
            git push origin HEAD:feature/phase-4-student-dashboard-safety
          fi
