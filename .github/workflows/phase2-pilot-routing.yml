name: Phase 2 Pilot Report Routing Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  phase2-routing:
    if: ${{ !contains(github.event.pull_request.head.sha || github.sha, 'visual-cleanup-diagnostic') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out visual release branch
        uses: actions/checkout@v4
        with:
          ref: feature/maptive-live-admin-visuals

      - name: Capture cleanup failure
        run: |
          mkdir -p docs/debug
          set +e
          {
            python -m pip install --disable-pip-version-check pillow==11.3.0
            python scripts/generate-brand-assets.py
          } > docs/debug/visual-release-cleanup.txt 2>&1
          status=$?
          echo "exit_status=$status" >> docs/debug/visual-release-cleanup.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/debug/visual-release-cleanup.txt
          git commit -m "ci: capture visual cleanup output [visual-cleanup-diagnostic]"
          git push origin HEAD:feature/maptive-live-admin-visuals

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Verify isolated reporting and campus case routing
        run: npm run test:phase2-routing

      - name: Type-check Phase 2 application changes
        run: npm run typecheck

      - name: Build production application
        run: npm run build
        env:
          VITE_PILOT_MODE_ENABLED: 'true'
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_REF: main
