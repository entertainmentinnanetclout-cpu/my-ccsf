name: Institutional Phases 2 and 3 Existing Branch

on:
  push:
    branches:
      - agent/institutional-hardening-phase-1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: institutional-phases-2-3-existing-branch
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out existing hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/institutional-hardening-phase-1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Integrate first-party Campus Radar
        run: node scripts/apply-institutional-radar-integration.mjs

      - name: Apply ES2020 compatibility
        run: node scripts/apply-es2020-compatibility.mjs

      - name: Add institutional release gate
        run: node scripts/apply-institutional-package-gate.mjs

      - name: Verify institutional Phase 2 and 3 scope
        run: npm run test:institutional-phases-2-3

      - name: Verify Safety Mobility
        run: npm run test:safety-mobility

      - name: Verify core product
        run: npm run test:phase4-product

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified integration
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- src/components/student/SafetyMobilityHub.tsx src/components/student/InstitutionalCampusRadar.tsx src/components/student/InstitutionalCaseReports.tsx package.json; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/student/SafetyMobilityHub.tsx src/components/student/InstitutionalCampusRadar.tsx src/components/student/InstitutionalCaseReports.tsx package.json
          git commit -m "feat: complete institutional Campus Radar and premium student surfaces"
          git push origin HEAD:agent/institutional-hardening-phase-1
