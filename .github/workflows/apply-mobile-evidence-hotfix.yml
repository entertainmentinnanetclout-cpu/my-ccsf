name: Apply Mobile Evidence Hotfix

on:
  push:
    branches:
      - fix/mobile-evidence-session-persistence

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-evidence-session-persistence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic source patch
        run: node scripts/apply-mobile-evidence-session-hotfix.mjs

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "Source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json
          git commit -m "fix: restore mobile evidence and report sessions"
          git push origin HEAD:fix/mobile-evidence-session-persistence
