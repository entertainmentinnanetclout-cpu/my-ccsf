name: Phase 5 Supabase Type Synchronisation

on:
  push:
    branches:
      - feature/controlled-pilot-mode

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[phase-5-types-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/controlled-pilot-mode
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/phase5-types-sync.mjs
      - name: Commit synchronized definitions
        run: |
          if git diff --quiet -- src/integrations/supabase/types.ts; then exit 0; fi
          git config user.name "CCSF Phase 5 Types Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          git commit -m "chore(phase5): synchronize Supabase types [phase-5-types-bot]"
          git push origin HEAD:feature/controlled-pilot-mode
