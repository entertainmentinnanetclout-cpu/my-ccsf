name: Phase 4 Navigation and Judiciary Hardening

on:
  push:
    branches:
      - feature/ccsf-phases-3-8-release-candidate
    paths:
      - scripts/apply-phase4-navigation-judiciary.py
      - .github/workflows/phase4-navigation-judiciary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/ccsf-phases-3-8-release-candidate
          fetch-depth: 0

      - name: Apply exact-match navigation and judiciary fixes
        run: python scripts/apply-phase4-navigation-judiciary.py

      - name: Commit navigation and judiciary fixes
        run: |
          if git diff --quiet -- \
            src/pages/Dashboard.tsx \
            src/components/shared/Navigation.tsx \
            src/pages/Profile.tsx \
            src/pages/Judiciary.tsx; then
            echo 'Navigation and judiciary fixes are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/pages/Dashboard.tsx \
            src/components/shared/Navigation.tsx \
            src/pages/Profile.tsx \
            src/pages/Judiciary.tsx
          git commit -m 'phase 4: repair profile deep links and staff judiciary flow'
          git push origin HEAD:feature/ccsf-phases-3-8-release-candidate
