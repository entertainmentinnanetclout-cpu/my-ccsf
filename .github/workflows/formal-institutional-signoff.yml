name: Formal Institutional Sign-Off Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  institutional-signoff:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://lfelzsubrlqwcsnetpov.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mk06MWImT-q1YuV_zFYsDg_r61IHhuO
      VITE_VAPID_PUBLIC_KEY: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Verify formal TUT governance sign-off model
        run: node scripts/verify-formal-institutional-signoff.mjs

      - name: Type-check application
        run: npm run typecheck

      - name: Lint application
        run: npm run lint

      - name: Build production application
        run: npm run build
        env:
          VITE_PILOT_MODE_ENABLED: 'false'
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_REF: main
