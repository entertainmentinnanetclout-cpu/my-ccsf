name: Join the Community Real and Pilot

on:
  push:
    branches:
      - agent/join-community-real-pilot
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: join-community-real-pilot-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out community branch
        uses: actions/checkout@v4
        with:
          ref: agent/join-community-real-pilot
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Integrate official Pilot and admin community surfaces
        run: node scripts/apply-community-integration.mjs

      - name: Verify Join the Community parity
        run: npm run test:community

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified integration
        run: |
          if git diff --quiet -- src/pages/Dashboard.tsx src/components/pilot/PilotStudentDashboard.tsx src/pages/Admin.tsx src/components/pilot/PilotSuperAdminDashboard.tsx package.json; then
            echo "No community integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Dashboard.tsx src/components/pilot/PilotStudentDashboard.tsx src/pages/Admin.tsx src/components/pilot/PilotSuperAdminDashboard.tsx package.json
          git commit -m "feat: integrate Join the Community across real Pilot and admin portals"
          git push origin HEAD:agent/join-community-real-pilot
