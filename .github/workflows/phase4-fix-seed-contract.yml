name: Phase 4 Fix Seed Contract

on:
  push:
    branches:
      - feature/phase-4-student-dashboard-safety

permissions:
  contents: write

jobs:
  fix-seed:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-seed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-4-student-dashboard-safety

      - name: Correct non-action carousel seed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260720233000_phase_4_student_dashboard_safety_resources.sql')
          source = path.read_text()
          before = "'40000000-0000-4000-8000-000000000001', 'Welcome to the My CCSF Pilot', 'Use this controlled environment to learn the safety workflow, test reporting and understand how campus-security teams receive Pilot cases.', 'Start here', 'shield', 'Explore the dashboard', 'none', 10, 'contain'"
          after = "'40000000-0000-4000-8000-000000000001', 'Welcome to the My CCSF Pilot', 'Use this controlled environment to learn the safety workflow, test reporting and understand how campus-security teams receive Pilot cases.', 'Start here', 'shield', null, 'none', 10, 'contain'"
          if before in source:
              path.write_text(source.replace(before, after))
          elif after not in source:
              raise SystemExit('Expected Phase 4 seed was not found.')
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260720233000_phase_4_student_dashboard_safety_resources.sql
          if git diff --cached --quiet; then
            echo "Seed contract already corrected."
          else
            git commit -m "fix: satisfy Phase 4 carousel action contract [phase4-seed]"
            git push origin HEAD:feature/phase-4-student-dashboard-safety
          fi
