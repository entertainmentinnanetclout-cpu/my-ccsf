name: Export Phase 5 Migrations

on:
  pull_request:
    branches:
      - feature/phase-4-student-dashboard-safety

permissions:
  contents: read

jobs:
  export-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tested migrations
        run: |
          mkdir -p phase5-migrations
          cp supabase/migrations/20260720213000_phase_3_pilot_reviews.sql phase5-migrations/
          cp supabase/migrations/20260720233000_phase_4_student_dashboard_safety_resources.sql phase5-migrations/
          cp supabase/migrations/20260721100000_phase_5_admin_management_release_gate.sql phase5-migrations/
          sha256sum phase5-migrations/*.sql > phase5-migrations/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tested-phase5-migrations
          path: phase5-migrations
          retention-days: 2
