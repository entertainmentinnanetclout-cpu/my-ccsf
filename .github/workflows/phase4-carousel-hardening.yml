name: Phase 4 Carousel Hardening

on:
  push:
    branches:
      - feature/ccsf-phases-3-8-release-candidate
    paths:
      - scripts/apply-phase4-carousel-hardening.py
      - .github/workflows/phase4-carousel-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/ccsf-phases-3-8-release-candidate
          fetch-depth: 0

      - name: Apply exact-match carousel fixes
        run: python scripts/apply-phase4-carousel-hardening.py

      - name: Commit carousel fixes
        run: |
          if git diff --quiet -- src/components/admin/CarouselManager.tsx; then
            echo 'Carousel fixes are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/admin/CarouselManager.tsx
          git commit -m 'phase 4: harden carousel media lifecycle and mobile controls'
          git push origin HEAD:feature/ccsf-phases-3-8-release-candidate
