name: Traffic Department Gate

on:
  push:
    branches:
      - feature/traffic-department
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  traffic-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Verify Traffic release contract
        run: npm run test:traffic
      - name: Type-check application
        run: npm run typecheck
      - name: Lint application
        run: npm run lint
      - name: Build production application
        run: npm run build
        env:
          VITE_PILOT_MODE_ENABLED: 'false'
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: feature/traffic-department
