name: Phase 4 Student Experience Gate

on:
  push:
    branches:
      - feature/phase-4-student-dashboard-safety
  pull_request:
    branches:
      - feature/phase-3-pilot-reviews

permissions:
  contents: read

jobs:
  phase4-experience:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Verify Phase 4 student experience
        run: npm run test:phase4-experience

      - name: Verify Phase 3 reviews remain intact
        run: npm run test:phase3-reviews

      - name: Verify Phase 2 reporting remains intact
        run: npm run test:phase2-routing

      - name: Verify Pilot production isolation
        run: npm run test:pilot-isolation

      - name: Verify student and campus-security parity
        run: npm run test:phase4-5-parity

      - name: Verify production and Pilot student-home separation
        run: npm run test:student-home

      - name: Inspect PDF structure
        run: |
          python - <<'PY'
          from pathlib import Path
          pdf = Path('public/downloads/CCSF-Pilot-Safety-Guide-v1.0.pdf')
          data = pdf.read_bytes()
          assert data.startswith(b'%PDF-')
          assert len(data) > 250_000
          assert data.count(b'/Type /Page') >= 12
          print(f'{pdf}: {len(data)} bytes, at least 12 pages')
          PY

      - name: Type-check application
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee phase4-typecheck.log

      - name: Lint application
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee phase4-lint.log

      - name: Upload Phase 4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-student-experience-diagnostics
          path: |
            phase4-typecheck.log
            phase4-lint.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce code-quality results
        if: always()
        run: |
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"

      - name: Build Pilot application
        run: npm run build
        env:
          VITE_PILOT_MODE_ENABLED: 'true'
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: feature/phase-4-student-dashboard-safety
