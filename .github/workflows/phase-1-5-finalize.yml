name: Phase 1.5 Finalize

on:
  push:
    branches:
      - feature/controlled-pilot-mode

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[phase-1-5-bot]') }}
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://lfelzsubrlqwcsnetpov.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mk06MWImT-q1YuV_zFYsDg_r61IHhuO
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/controlled-pilot-mode
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply deterministic Phase 1.5 frontend fixes
        run: node .github/scripts/phase1_5_finalize.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit generated synchronisation changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "CCSF Phase 1.5 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/integrations/supabase/types.ts src/components/admin/CampusAdminManager.tsx
          git commit -m "fix(phase1.5): sync frontend types and password policy [phase-1-5-bot]"
          git push origin HEAD:feature/controlled-pilot-mode
