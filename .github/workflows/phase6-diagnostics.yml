name: Phase 6 Diagnostics

on:
  push:
    branches:
      - feature/controlled-pilot-mode

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://lfelzsubrlqwcsnetpov.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mk06MWImT-q1YuV_zFYsDg_r61IHhuO
      VITE_VAPID_PUBLIC_KEY: ''
      VITE_PILOT_MODE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Capture TypeScript diagnostics
        run: npm run typecheck > typecheck.log 2>&1 || true
      - name: Capture lint diagnostics
        run: npm run lint > lint.log 2>&1 || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase6-diagnostics
          path: |
            typecheck.log
            lint.log
          retention-days: 7
